name: Build DNS CASES APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/dnscases/app app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          python3 -c 'import struct, zlib; w=h=192; raw=bytearray(); [ (raw.append(0), [ raw.extend((0,240,255,255) if ((x-96)**2+(y-96)**2)**0.5 < 56 else ((255,42,133,255) if ((x-96)**2+(y-96)**2)**0.5 < 78 else (7,11,20,255))) for x in range(w) ]) for y in range(h) ]; ch=lambda t,d: struct.pack("!I",len(d))+t+d+struct.pack("!I",zlib.crc32(t+d)&0xffffffff); png=b"\x89PNG\r\n\x1a\n"+ch(b"IHDR",struct.pack("!IIBBBBB",w,h,8,6,0,0,0))+ch(b"IDAT",zlib.compress(bytes(raw)))+ch(b"IEND",b""); [ open(f"app/src/main/res/{d}/{n}","wb").write(png) for d in ["mipmap-mdpi","mipmap-hdpi","mipmap-xhdpi","mipmap-xxhdpi","mipmap-xxxhdpi"] for n in ["ic_launcher.png","ic_launcher_round.png"] ]'

          printf 'rootProject.name = "DNS CASES"\ninclude ":app"\n' > settings.gradle
          printf 'buildscript {\n repositories { google(); mavenCentral() }\n dependencies { classpath "com.android.tools.build:gradle:8.5.2" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > gradle.properties
          printf 'plugins { id "com.android.application" }\nandroid {\n namespace "com.dnscases.app"\n compileSdk 34\n defaultConfig {\n  applicationId "com.dnscases.app"\n  minSdk 23\n  targetSdk 34\n  versionCode 13\n  versionName "2.6"\n }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n}\n' > app/build.gradle
          printf '<resources><string name="app_name">DNS CASES</string></resources>\n' > app/src/main/res/values/strings.xml

          cat << 'EOF' > app/src/main/res/drawable/card_dark.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#111827" />
              <stroke android:width="1dp" android:color="#1E293B" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/status_box.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0F172A" />
              <stroke android:width="1.5dp" android:color="#00F0FF" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="DNS CASES"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android
                  
