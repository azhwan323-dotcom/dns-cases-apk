name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Clean old native files & init Capacitor from www
        run: |
          rm -rf android capacitor.config.json capacitor.config.ts package.json package-lock.json
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "DNS CASES PRO" "com.dnscases.pro" --web-dir=www
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode=none

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-cases-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
