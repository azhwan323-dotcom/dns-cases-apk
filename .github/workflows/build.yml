name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor & initialize Android if needed
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "DNS CASES PRO" "com.dnscases.pro" --web-dir=www
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap copy android --force
          npx cap sync android --force

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode=none

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-cases-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
