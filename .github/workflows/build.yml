name: Build DNS CASES APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Setup Project & Icon
        run: |
          python3 - << 'PYEOF'
          import os, struct, zlib

          dirs = [
              "app/src/main/java/com/dnscases/app",
              "app/src/main/res/layout",
              "app/src/main/res/values",
              "app/src/main/res/mipmap-mdpi",
              "app/src/main/res/mipmap-hdpi",
              "app/src/main/res/mipmap-xhdpi",
              "app/src/main/res/mipmap-xxhdpi",
              "app/src/main/res/mipmap-xxxhdpi",
              "app/src/main/assets",
          ]
          for d in dirs:
              os.makedirs(d, exist_ok=True)

          def write_file(path, content):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          svg_icon = """
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="110" fill="#070b14"/>
            <polygon points="256,70 400,135 370,310 256,395 142,310 112,135" fill="none" stroke="#00f0ff" stroke-width="18"/>
            <polygon points="270,130 215,245 262,245 242,340 312,215 265,215" fill="#ff2a85"/>
            <text x="256" y="458" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">DNS CASES</text>
          </svg>
          """
          write_file("app/src/main/assets/dns_icon.svg", svg_icon)

          def make_png(w, h):
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      dx, dy = (x - w / 2) / (w / 2), (y - h / 2) / (h / 2)
                      dist = (dx * dx + dy * dy) ** 0.5
                      if dist < 0.35:
                          r, g, b = 255, 42, 133
                      elif dist < 0.65:
                          r, g, b = 0, 240, 255
                      else:
                          r, g, b = 7, 11, 20
                      raw.extend((r, g, b, 255))
              ihdr = struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw))) + chunk(b"IEND", b"")

          png_bytes = make_png(192, 192)
          for d in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              for name in ["ic_launcher.png", "ic_launcher_round.png"]:
                  with open(f"app/src/main/res/{d}/{name}", "wb") as f:
                      f.write(png_bytes)

          if os.path.exists("www/index.html"):
              with open("www/index.html", "r", encoding="utf-8") as src:
                  html_data = src.read()
          elif os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8") as src:
                  html_data = src.read()
          else:
              html_data = "<h1>DNS CASES</h1>"
          write_file("app/src/main/assets/index.html", html_data)

          write_file("settings.gradle", """
          rootProject.name = "DNS CASES"
          include ':app'
          """)

          write_file("build.gradle", """
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          """)

          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          """)

          write_file("app/build.gradle", """
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dnscases.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dnscases.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName "1.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }
          """)

          write_file("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="DNS CASES"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          write_file("app/src/main/res/layout/activity_main.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          """)

          write_file("app/src/main/res/values/strings.xml", """
          <resources>
              <string name="app_name">DNS CASES</string>
          </resources>
          """)

          write_file("app/src/main/java/com/dnscases/app/MainActivity.java", """
          package com.dnscases.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  WebView webView = findViewById(R.id.webview);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          """)
          PYEOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-cases-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
