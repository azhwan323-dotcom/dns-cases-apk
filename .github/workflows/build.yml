name: Build DNS CASES APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/dnscases/app app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-mdpi
          printf 'rootProject.name = "DNS CASES"\ninclude ":app"\n' > settings.gradle
          printf 'buildscript {\n repositories { google(); mavenCentral() }\n dependencies { classpath "com.android.tools.build:gradle:8.5.2" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > gradle.properties
          printf 'plugins { id "com.android.application" }\nandroid {\n namespace "com.dnscases.app"\n compileSdk 34\n defaultConfig {\n  applicationId "com.dnscases.app"\n  minSdk 23\n  targetSdk 34\n  versionCode 10\n  versionName "2.3"\n }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n}\n' > app/build.gradle
          printf '<resources><string name="app_name">DNS CASES</string></resources>\n' > app/src/main/res/values/strings.xml
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="DNS CASES" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>\n' > app/src/main/AndroidManifest.xml
          printf '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#070B14" android:gravity="center" android:orientation="vertical"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="DNS CASES READY" android:textColor="#00F0FF" android:textSize="24sp"/></LinearLayout>\n' > app/src/main/res/layout/activity_main.xml
          printf 'package com.dnscases.app; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { @Override protected void onCreate(Bundle b) { super.onCreate(b); setContentView(R.layout.activity_main); } }\n' > app/src/main/java/com/dnscases/app/MainActivity.java

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-cases-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
