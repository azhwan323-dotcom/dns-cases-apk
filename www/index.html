<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS CASES PRO</title>
    <style>
        :root {
            --bg: #050811;
            --surface: #0e1525;
            --surface-2: #152036;
            --cyan: #00f0ff;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --green: #10b981;
            --red: #f43f5e;
            --amber: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --line: rgba(148, 163, 184, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(circle at 50% -10%, rgba(0, 240, 255, 0.16), transparent 55%),
                radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.14), transparent 45%);
            color: var(--text);
            min-height: 100vh;
            padding: 14px 14px 52px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #050811;
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.35);
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 800;
        }

        .brand p {
            font-size: 11px;
            color: var(--cyan);
        }

        .conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(244, 63, 94, 0.14);
            color: var(--red);
            border: 1px solid rgba(244, 63, 94, 0.35);
        }

        .conn-pill.on {
            background: rgba(16, 185, 129, 0.14);
            color: var(--green);
            border-color: rgba(16, 185, 129, 0.35);
        }

        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Hero Banner with SVG Art */
        .hero-banner {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.25);
            background: linear-gradient(135deg, #0b1324 0%, #141b38 55%, #0a192f 100%);
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
